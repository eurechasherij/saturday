[project]
name = "saturday-backend"
version = "0.1.0"
description = "AI-driven crypto futures backtesting & research tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "polars>=1.12.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "ta>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "E501"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
